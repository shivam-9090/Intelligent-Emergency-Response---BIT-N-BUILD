name: Frontend CI

on:
  pull_request:
    branches: [main, develop, develop-ved]
    paths:
      - "frontend/**"
      - "infra/docker/Dockerfile.frontend"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop, develop-ved]
    paths:
      - "frontend/**"
      - "infra/docker/Dockerfile.frontend"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and production build
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f ../infra/docker/Dockerfile.frontend -t emergency-frontend:ci .
